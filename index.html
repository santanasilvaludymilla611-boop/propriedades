
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade - Modelo de Caixa</title>

<style>
p {
  background-color: #C2F670;
  width: 200px;
  height: 200px;
}

.exemplo1 {
  border: double black medium;
}

.exemplo2 {
  padding: 2em;
}

.exemplo3 {
  border: 4px solid red;
  padding: 2em;
}

.exemplo4 {
  border: 4px solid red;
  margin: 2em;
}

.exemplo5 {
  border: 4px dashed black;
  padding: 1em;
  margin: 5em;
}

.exemplo6 {
  border: 2px solid black;
  padding: 1em 50px;
  margin: 0 auto;
}
</style>
</head>

<body>

<p class="exemplo1">Exemplo 1</p>

<p class="exemplo2">Exemplo 2</p>

<p class="exemplo3">Exemplo 3</p>

<p class="exemplo4">Exemplo 4</p>

<p class="exemplo5">Exemplo 5</p>

<p class="exemplo6">Exemplo 6</p>

</body>
</html>
